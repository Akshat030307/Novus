server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # build output + game art. JS/CSS are content-hashed; art is not, so keep
    # the window short enough that a redeploy is picked up within a day.
    location /assets/ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # Two documents, not one (see vite.config.ts):
    #
    #   /            index.html — the front door. A static page with its own
    #                canvas work and no React in it, so reading it does not
    #                download the game.
    #   /play,       play.html  — the React app: the city, the Academy, and
    #   /teach       the teacher side. Both paths are routed inside the app,
    #                so every deeper URL has to reach the same document.
    #
    # Order matters: these two blocks are more specific than `location /`,
    # so they win before the SPA fallback sees the request.
    location /play {
        try_files $uri /play.html;
        add_header Cache-Control "no-cache";
    }

    location /teach {
        try_files $uri /play.html;
        add_header Cache-Control "no-cache";
    }

    # anything else falls back to the front door, which is never cached
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
